[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookforge"
version = "1.0.0"
description = "电子书 / 漫画格式转换引擎，纯标准库自研，不依赖 Calibre"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bookforge = "bookforge.cli:main"

[tool.setuptools.packages.find]
include = ["bookforge*"]
