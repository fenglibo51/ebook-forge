services:
  ebook-forge:
    build: .
    container_name: ebook-forge
    restart: unless-stopped
    ports:
      # 宿主 8505（和老项目一致，反代不用改）→ 容器内 8506
      - "8505:8506"
    volumes:
      # 书库要 rw：转换结果默认落在源文件同目录
      - /volume1/Book:/Book:rw
      # 运行时数据（历史 / 设置 / 上传副本）
      - ./data:/data
    environment:
      EBOOKFORGE_DATA: /data
      BOOKFORGE_RENDER_DPI: "200"
      BOOKFORGE_RENDER_FALLBACK: "true"
