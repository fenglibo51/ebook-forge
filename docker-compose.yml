# EbookForge —— 电子书 / 漫画格式转换
#
# 用法：
#   docker compose up -d --build      启动（首次会构建镜像，约 2 分钟）
#   docker compose logs -f            看日志
#   docker compose down               停止
#
# 只需要改一处：下面 volumes 里的书库路径。

services:
  ebook-forge:
    build: .
    image: ebook-forge:latest
    container_name: ebook-forge
    restart: unless-stopped

    ports:
      # 左边 = NAS 上的端口（反代指向它，想换就改左边）
      # 右边 = 容器内固定 8506，别动
      - "8505:8506"

    volumes:
      # ── 书库 ──────────────────────────────────────────────────────
      # 改成你自己的书库路径。必须是 rw：
      #   转换结果默认写回源文件所在的目录，只读会失败。
      - /volume1/Book:/Book:rw

      # ── 数据 ──────────────────────────────────────────────────────
      # 转换记录、设置、上传的临时副本。
      #
      # 默认用命名卷：不用你做任何准备工作，首次创建会自动带上正确的属主。
      - ebookforge-data:/data
      #
      # 想直接看到 data 里的 json 文件，可以改成下面这行（bind mount），
      # 但**必须先手动建目录并改属主**，否则容器非 root 写不进去、起不来：
      #   mkdir -p ./data && sudo chown -R 10000:10000 ./data
      # - ./data:/data

    environment:
      # 数据目录（跟上面的挂载对应，不用改）
      EBOOKFORGE_DATA: /data

      # ── 管理令牌 ──────────────────────────────────────────────────
      # 设了之后，后台接口（书库/记录/设置/缓存）都要令牌，分享链接的访客不受影响。
      # 值写在同目录的 .env 文件里（不进 git），格式：EBOOKFORGE_ADMIN_TOKEN=xxx
      # 留空 = 不启用，谁都能访问后台（只建议在纯内网用）。
      EBOOKFORGE_ADMIN_TOKEN: ${EBOOKFORGE_ADMIN_TOKEN:-}
      # 时区，影响记录里的时间显示
      TZ: Asia/Shanghai

      # ── 可选 ──────────────────────────────────────────────────────
      # 蒙版 PDF 走渲染兜底时的精度：150 / 200 / 300
      # 200 约 5 秒一页；300 体积翻倍速度减半。界面设置里也能改。
      BOOKFORGE_RENDER_DPI: "200"
      # 是否允许自动渲染。改成 false 后，这类 PDF 直接报错，不会转成有损图片。
      BOOKFORGE_RENDER_FALLBACK: "true"
      # 上传副本保留多久（秒）。默认 24 小时自动清理，界面里可手动清。
      EBOOKFORGE_UPLOAD_TTL: "86400"

    # 容器内以 uid 10000 运行（Dockerfile 里的 USER），配合下面两条进一步收紧：
    security_opt:
      - no-new-privileges:true    # 禁止通过 setuid 之类的手段提权
    cap_drop:
      - ALL                       # 丢掉所有 Linux capabilities（纯 HTTP 服务不需要任何一条）

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8506/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    # 处理大合集会吃内存，需要的话放开下面几行限制一下
    # deploy:
    #   resources:
    #     limits:
    #       memory: 2G

volumes:
  ebookforge-data:
