name: Publish image

# 只在打 tag 的时候推（v1.0.0 这种），或者手动触发。
# 平时 push 到 master 不推镜像 —— 提交多了会在 ghcr 上堆一堆没人用的 layer。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要打的 tag（默认用 package 的 latest + 仓库版本号）"
        required: false
        default: ""

permissions:
  contents: read
  packages: write          # 这一行是关键：没有它 GITHUB_TOKEN 推不了 ghcr

# 发布串行化：同一时间只跑一个发布工作流，别让两个版本互相抢标签。
# cancel-in-progress: false —— 已经在跑的发布不能被后来的取消，
# 否则可能出现「candidate 推了、验证到一半被砍、正式标签没晋升」。
# 串行本身不保证版本顺序（先排队的可能后跑完），所以晋升步骤里还有
# 一道「只升不降」的版本比较，两者缺一不可。
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # 发布门禁：镜像推送之前必须先过完整单元测试。
  # 之前没有这一步 —— CI 明明红了，打 tag 照样把镜像推上去了，
  # v1.0.4 就是这么发出去的一个「测试是失败的、但镜像发布了」的版本。
  # 发布脚本自己那套冒烟只证明「能启动、能转一个文件」，替代不了全量测试。
  test:
    name: 发布前单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖（运行 + 测试）
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: 跑全量测试
        run: python -m unittest discover -s tests -v

      - name: 语法检查
        run: python -m compileall -q bookforge backend

  build-and-push:
    needs: test            # 测试不过就别推镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 tag
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          # ── 版本号从哪来，完全按事件类型决定 ──
          #
          # 血泪史（三轮）：
          #   v1.0.10  只有黑名单拦 SemVer   → 填 latest 照样覆盖正式版
          #   v1.0.11  latest 改成看 ref      → workflow_dispatch 能把 ref 设成旧 tag
          #   v1.0.12  加了 push + SemVer 判断 → latest 挡住了，但 ver 仍然从 ref 派生，
          #            晋升步骤无条件 docker push "$IMG:$VER" → 覆盖历史版本标签
          #
          # 根子上的教训：**手动触发永远不要从 GITHUB_REF 派生版本号**。
          # GitHub 允许 workflow_dispatch 指定 tag 作为 ref，手动跑一次、ref 填
          # v1.0.11、输入框留空，就能拿到 ver=1.0.11 —— 实测确认过。
          IS_RELEASE=0
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ -z "$INPUT_TAG" ]; then
              # 手动触发不填标签 = 开发构建。不看 ref，哪怕它是个 tag。
              TAGGED="dev"
            else
              TAGGED="$INPUT_TAG"
              # 白名单：只放行开发标签
              case "$TAGGED" in
                dev|test-*|sha-*|pr-*) ;;
                latest|candidate)
                  echo "::error::'${TAGGED}' 是发布流程内部保留的标签，手动触发不能用"
                  exit 1 ;;
                *)
                  echo "::error::手动触发只能用 dev / test-* / sha-* / pr-*，收到 '${TAGGED}'"
                  echo "正式发布请打 git tag：git tag v1.1.0 && git push origin v1.1.0"
                  exit 1 ;;
              esac
            fi
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            if [[ "${GITHUB_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              TAGGED="${GITHUB_REF#refs/tags/v}"     # v1.1.0 → 1.1.0
              IS_RELEASE=1
            elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              # push 了一个 tag 但不是 vX.Y.Z（vfoo / vlatest / v1.2）
              echo "::error::tag '${GITHUB_REF#refs/tags/}' 不是 vX.Y.Z 格式，不发布"
              echo "正式发布请用：git tag v1.1.0 && git push origin v1.1.0"
              exit 1
            else
              TAGGED="dev"                            # 推 master
            fi
          else
            TAGGED="dev"                              # 其它事件一律当开发构建
          fi
          echo "ver=${TAGGED}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"

          if [ "$IS_RELEASE" = "1" ]; then
            echo "latest=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
            echo "将要推送：${IMAGE}:${TAGGED} 和 :latest（正式发布）"
          else
            echo "latest=" >> "$GITHUB_OUTPUT"
            echo "将要推送：${IMAGE}:${TAGGED}（不动 latest）"
          fi
          # 候选标签绑定到本次运行 —— 并发发布不会互相覆盖。
          # 用固定 :candidate 的话，运行 A 推完、B 也推 candidate（改写指针），
          # A 再 pull 回来拿到的就是 B 的镜像；虽然 revision 校验能拦住，
          # 但 A 本来正常的发布会无故失败。
          echo "candidate=${IMAGE}:candidate-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建候选镜像（只推临时 candidate 标签）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 版本号注入：镜像里的 /api/health 和侧边栏显示的就是这个值，
          # 不用再手改代码里的 __version__ —— 改了 tag 忘了改代码这种事不会再有。
          build-args: |
            VERSION=${{ steps.meta.outputs.ver }}
          # ⚠️ 这里**只推 candidate 一个临时标签**，不碰正式版本号和 latest。
          #
          # 早先是 push: true 直接推 `${{ver}}` 和 `latest`，然后才拉回来起容器验证。
          # 问题：冒烟一旦失败，GHCR 上的 latest 已经被换成坏镜像了 ——
          # 工作流标红是事后通知，用户那边可能已经拉走了。
          #
          # 现在：推 candidate → 拉回来跑真实容器和端到端冒烟 → 全过之后才
          # `docker tag` + `docker push` 晋升成正式标签。tag 是本地改指针，
          # 推上去的 digest 和刚才验证的那个完全一致，不存在「验 A 发 B」。
          tags: |
            ${{ steps.meta.outputs.candidate }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.ver }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 从仓库拉回候选镜像
        run: |
          set -e
          IMG="${{ steps.meta.outputs.candidate }}"
          # ⚠️ build-push-action 用的是 docker-container driver，构建结果在 builder
          # 自己的存储里，**不会**自动落到本机 Docker Engine。干净 runner 上直接
          # `docker image inspect` 会找不到 tag，后面 docker run 也没镜像可跑。
          # 所以必须先删本地同名（如果有）再从 registry 真拉一遍 ——
          # 顺便也证明了「推上去的东西确实拉得下来」。
          docker rmi "$IMG" 2>/dev/null || true
          docker pull "$IMG"

      - name: 确认镜像就是这次提交构建的
        run: |
          set -e
          IMG="${{ steps.meta.outputs.candidate }}"
          REV=$(docker image inspect "$IMG" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          echo "镜像 revision = $REV"
          echo "本次提交      = ${{ github.sha }}"
          [ "$REV" = "${{ github.sha }}" ] || { echo "✗ 镜像不是这次提交构建的（可能命中了旧缓存）"; exit 1; }

      - name: 起容器
        run: |
          docker run -d --name smoke -p 8506:8506 \
            -e EBOOKFORGE_DATA=/data \
            -e EBOOKFORGE_BOOK_DIR=/data/Book \
            "${{ steps.meta.outputs.candidate }}"

      - name: 镜像里该有的东西都在
        run: |
          set -e
          IMG="${{ steps.meta.outputs.candidate }}"
          # ⚠️ 字体装在 /usr/share/fonts/truetype/noto/，不是 /app/assets/fonts/
          # （Dockerfile 是 COPY 过去的，源码目录不留在镜像里）。早先这里写错路径，
          # 镜像明明有字体也会被判失败。
          # 容器默认 USER 10000，所以 `test -r` 验的就是「非 root 读不读得到」。
          docker run --rm --entrypoint sh "$IMG" -c \
            'test -r /usr/share/fonts/truetype/noto/NotoSansSC-Regular.ttf \
             && ls -la /usr/share/fonts/truetype/noto/ \
             && echo "字体存在且 uid $(id -u) 可读"' \
            || { echo "✗ 字体缺失或非 root 读不到"; exit 1; }
          docker run --rm --entrypoint python3 "$IMG" -c "import fastapi, uvicorn, multipart; print('web 依赖 OK')"

      - name: 端到端冒烟（上传→转换→下载）
        run: |
          # 正式发布必须硬断言版本号：镜像 tag 说 1.0.7，/api/health 就得报 1.0.7。
          # 早先这里只是把健康检查的 JSON 打印出来，没人会真去比对，
          # 版本号注入没生效也一样能发出去。
          # 手动 dev 构建时 steps.meta.outputs.ver 是 dev，镜像里也是 dev，同样对得上。
          python3 .github/smoke_test.py --base http://127.0.0.1:8506 \
            --expected-version "${{ steps.meta.outputs.ver }}"

      # ── 这里是分界线：上面全绿，才允许把 candidate 晋升成正式标签 ──
      #
      # 顺序为什么重要：早先直接 push 正式标签再验证，冒烟一失败 GHCR 上的
      # latest 已经是坏镜像了。现在 candidate 是唯一的出口，只有走到这一步
      # 才会动正式标签。docker tag 是本地改指针，push 上去的 digest 和
      # 刚才拉回、起容器、跑过冒烟的那个 candidate 完全一致。
      - name: 验证通过，晋升正式标签
        run: |
          set -e
          IMG="${{ env.IMAGE }}"
          SRC="${{ steps.meta.outputs.candidate }}"
          VER="${{ steps.meta.outputs.ver }}"
          LATEST="${{ steps.meta.outputs.latest }}"
          IS_RELEASE="${{ steps.meta.outputs.is_release }}"

          # 二次校验（P1，2026-11-24 复审）：非正式发布时 VER 必须过开发标签白名单。
          #
          # 上一版只挡住了「推 latest」，但晋升步骤是无条件
          # `docker tag "$SRC" "$IMG:$VER"; docker push "$IMG:$VER"` ——
          # 手动跑、ref 填旧 tag v1.0.11、输入框留空，ver 就是 1.0.11，
          # latest 挡住了，正式版本号照推，把历史镜像覆盖掉。实测确认过。
          if [ "$IS_RELEASE" != "1" ]; then
            case "$VER" in
              dev|test-*|sha-*|pr-*) ;;
              *)
                echo "::error::非正式发布却要推 '$VER' 这个标签，拒绝（会覆盖正式版/保留标签）"
                exit 1 ;;
            esac
          fi
          if [ -n "$LATEST" ] && [ "$IS_RELEASE" != "1" ]; then
            echo "::error::is_release=$IS_RELEASE 却要推 latest，拒绝"
            exit 1
          fi

          # 只升不降：两个正式版并发/重跑时，后完成的不一定是更新的版本。
          #
          # ⚠️ 拉取失败必须 fail closed（P2，2026-11-24 复审）：
          # docker pull 失败有两种可能 ——「首次发布，latest 不存在」和
          # 「网络/权限/限流故障」。早先一律当成前者继续晋升，
          # 等于故障时版本倒退保护直接失效。现在用 manifest inspect 区分。
          if [ -n "$LATEST" ] && [ "$VER" != "dev" ]; then
            CUR_VER=""
            if docker pull "$IMG:latest" >/dev/null 2>&1; then
              CUR_VER=$(docker image inspect "$IMG:latest" \
                --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' 2>/dev/null || true)
              if [ -n "$CUR_VER" ] && [ "$CUR_VER" != "dev" ] && \
                 ! [[ "$CUR_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::现有 latest 的 version label 是 '$CUR_VER'，不是 SemVer —— 无法判断先后，拒绝自动晋升，请人工检查"
                exit 1
              fi
            elif docker manifest inspect "$IMG:latest" >/dev/null 2>&1; then
              echo "::error::registry 上查得到 latest 的 manifest，但拉不下来 —— 网络/权限/限流故障。"
              echo "无法比较版本先后，为了不覆盖可能更新的正式版，拒绝本次 latest 晋升"
              exit 1
            else
              echo "GHCR 上还没有 latest，按首次发布处理"
            fi
            if [ -n "$CUR_VER" ] && [ "$CUR_VER" != "dev" ] && [ "$CUR_VER" != "$VER" ]; then
              HIGHEST=$(printf '%s\n%s\n' "$CUR_VER" "$VER" | sort -V | tail -1)
              if [ "$HIGHEST" != "$VER" ]; then
                echo "本次 $VER 低于 GHCR 上现有的 latest（$CUR_VER），跳过 latest 晋升，防止版本回退"
                LATEST=""
              else
                echo "本次 $VER 高于现有的 latest（$CUR_VER），继续晋升"
              fi
            fi
          fi

          echo "验证通过的镜像："
          docker image inspect "$SRC" --format '  ID={{.Id}}'

          docker tag "$SRC" "$IMG:$VER"
          docker push "$IMG:$VER"
          echo "✓ 已发布 $IMG:$VER"

          if [ -n "$LATEST" ]; then
            docker tag "$SRC" "$IMG:latest"
            docker push "$IMG:latest"
            echo "✓ 已发布 $IMG:latest"
          else
            echo "（非正式 tag 触发，不动 latest）"
          fi

          echo "最终确认：正式标签与本提交一致"
          REV=$(docker image inspect "$IMG:$VER" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          [ "$REV" = "${{ github.sha }}" ] || { echo "✗ 晋升后的镜像 revision 不对"; exit 1; }
          echo "  revision = $REV"

      - name: 失败时导出容器日志
        if: failure()
        run: docker logs smoke 2>&1 | tail -60 || true

      - name: 清理容器
        if: always()
        run: docker rm -f smoke 2>/dev/null || true
