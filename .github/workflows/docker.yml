name: Publish image

# 只在打 tag 的时候推（v1.0.0 这种），或者手动触发。
# 平时 push 到 master 不推镜像 —— 提交多了会在 ghcr 上堆一堆没人用的 layer。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要打的 tag（默认用 package 的 latest + 仓库版本号）"
        required: false
        default: ""

permissions:
  contents: read
  packages: write          # 这一行是关键：没有它 GITHUB_TOKEN 推不了 ghcr

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # 发布门禁：镜像推送之前必须先过完整单元测试。
  # 之前没有这一步 —— CI 明明红了，打 tag 照样把镜像推上去了，
  # v1.0.4 就是这么发出去的一个「测试是失败的、但镜像发布了」的版本。
  # 发布脚本自己那套冒烟只证明「能启动、能转一个文件」，替代不了全量测试。
  test:
    name: 发布前单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖（运行 + 测试）
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: 跑全量测试
        run: python -m unittest discover -s tests -v

      - name: 语法检查
        run: python -m compileall -q bookforge backend

  build-and-push:
    needs: test            # 测试不过就别推镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 tag
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAGGED="$INPUT_TAG"
            # 手动触发不许占用正式版本号。否则手动填个 1.0.3 就能把已经发布的
            # 那个镜像标签覆盖掉 —— 历史版本就不再是历史了。
            # 正式版只能走 git tag：git tag v1.0.4 && git push origin v1.0.4
            # 前后都允许 v/V 前缀：V1.2.3 这种大小写混写也一样会撞上正式版标签。
            if [[ "$TAGGED" =~ ^[vV]?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              echo "::error::手动触发不能用正式版本号 '${TAGGED}'，会覆盖已有镜像标签"
              echo "正式发布请打 git tag：git tag v1.0.4 && git push origin v1.0.4"
              echo "手动构建请用 dev / test-* / sha-* 这类名字"
              exit 1
            fi
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAGGED="${GITHUB_REF#refs/tags/}"
            TAGGED="${TAGGED#v}"          # v1.0.0 → 1.0.0
          else
            TAGGED="dev"
          fi
          echo "ver=${TAGGED}" >> "$GITHUB_OUTPUT"
          # latest 只跟「正式 git tag」走，不看标签名叫什么。
          # 早先的判断是 TAGGED != "dev" —— 手动输入 test123 这种照样会
          # 更新 latest。现在只看触发来源：只有 push refs/tags/v* 才算正式发布。
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "latest=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
            echo "将要推送：${IMAGE}:${TAGGED} 和 :latest（正式发布）"
          else
            echo "latest=" >> "$GITHUB_OUTPUT"
            echo "将要推送：${IMAGE}:${TAGGED}（不动 latest）"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建候选镜像（只推临时 candidate 标签）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 版本号注入：镜像里的 /api/health 和侧边栏显示的就是这个值，
          # 不用再手改代码里的 __version__ —— 改了 tag 忘了改代码这种事不会再有。
          build-args: |
            VERSION=${{ steps.meta.outputs.ver }}
          # ⚠️ 这里**只推 candidate 一个临时标签**，不碰正式版本号和 latest。
          #
          # 早先是 push: true 直接推 `${{ver}}` 和 `latest`，然后才拉回来起容器验证。
          # 问题：冒烟一旦失败，GHCR 上的 latest 已经被换成坏镜像了 ——
          # 工作流标红是事后通知，用户那边可能已经拉走了。
          #
          # 现在：推 candidate → 拉回来跑真实容器和端到端冒烟 → 全过之后才
          # `docker tag` + `docker push` 晋升成正式标签。tag 是本地改指针，
          # 推上去的 digest 和刚才验证的那个完全一致，不存在「验 A 发 B」。
          tags: |
            ${{ env.IMAGE }}:candidate
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.ver }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 从仓库拉回候选镜像
        run: |
          set -e
          IMG="${{ env.IMAGE }}:candidate"
          # ⚠️ build-push-action 用的是 docker-container driver，构建结果在 builder
          # 自己的存储里，**不会**自动落到本机 Docker Engine。干净 runner 上直接
          # `docker image inspect` 会找不到 tag，后面 docker run 也没镜像可跑。
          # 所以必须先删本地同名（如果有）再从 registry 真拉一遍 ——
          # 顺便也证明了「推上去的东西确实拉得下来」。
          docker rmi "$IMG" 2>/dev/null || true
          docker pull "$IMG"

      - name: 确认镜像就是这次提交构建的
        run: |
          set -e
          IMG="${{ env.IMAGE }}:candidate"
          REV=$(docker image inspect "$IMG" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          echo "镜像 revision = $REV"
          echo "本次提交      = ${{ github.sha }}"
          [ "$REV" = "${{ github.sha }}" ] || { echo "✗ 镜像不是这次提交构建的（可能命中了旧缓存）"; exit 1; }

      - name: 起容器
        run: |
          docker run -d --name smoke -p 8506:8506 \
            -e EBOOKFORGE_DATA=/data \
            -e EBOOKFORGE_BOOK_DIR=/data/Book \
            "${{ env.IMAGE }}:candidate"

      - name: 镜像里该有的东西都在
        run: |
          set -e
          IMG="${{ env.IMAGE }}:candidate"
          # ⚠️ 字体装在 /usr/share/fonts/truetype/noto/，不是 /app/assets/fonts/
          # （Dockerfile 是 COPY 过去的，源码目录不留在镜像里）。早先这里写错路径，
          # 镜像明明有字体也会被判失败。
          # 容器默认 USER 10000，所以 `test -r` 验的就是「非 root 读不读得到」。
          docker run --rm --entrypoint sh "$IMG" -c \
            'test -r /usr/share/fonts/truetype/noto/NotoSansSC-Regular.ttf \
             && ls -la /usr/share/fonts/truetype/noto/ \
             && echo "字体存在且 uid $(id -u) 可读"' \
            || { echo "✗ 字体缺失或非 root 读不到"; exit 1; }
          docker run --rm --entrypoint python3 "$IMG" -c "import fastapi, uvicorn, multipart; print('web 依赖 OK')"

      - name: 端到端冒烟（上传→转换→下载）
        run: |
          # 正式发布必须硬断言版本号：镜像 tag 说 1.0.7，/api/health 就得报 1.0.7。
          # 早先这里只是把健康检查的 JSON 打印出来，没人会真去比对，
          # 版本号注入没生效也一样能发出去。
          # 手动 dev 构建时 steps.meta.outputs.ver 是 dev，镜像里也是 dev，同样对得上。
          python3 .github/smoke_test.py --base http://127.0.0.1:8506 \
            --expected-version "${{ steps.meta.outputs.ver }}"

      # ── 这里是分界线：上面全绿，才允许把 candidate 晋升成正式标签 ──
      #
      # 顺序为什么重要：早先直接 push 正式标签再验证，冒烟一失败 GHCR 上的
      # latest 已经是坏镜像了。现在 candidate 是唯一的出口，只有走到这一步
      # 才会动正式标签。docker tag 是本地改指针，push 上去的 digest 和
      # 刚才拉回、起容器、跑过冒烟的那个 candidate 完全一致。
      - name: 验证通过，晋升正式标签
        run: |
          set -e
          IMG="${{ env.IMAGE }}"
          SRC="$IMG:candidate"
          VER="${{ steps.meta.outputs.ver }}"
          LATEST="${{ steps.meta.outputs.latest }}"

          echo "验证通过的镜像："
          docker image inspect "$SRC" --format '  ID={{.Id}}'

          docker tag "$SRC" "$IMG:$VER"
          docker push "$IMG:$VER"
          echo "✓ 已发布 $IMG:$VER"

          if [ -n "$LATEST" ]; then
            docker tag "$SRC" "$IMG:latest"
            docker push "$IMG:latest"
            echo "✓ 已发布 $IMG:latest"
          else
            echo "（非正式 tag 触发，不动 latest）"
          fi

          echo "最终确认：正式标签与本提交一致"
          REV=$(docker image inspect "$IMG:$VER" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          [ "$REV" = "${{ github.sha }}" ] || { echo "✗ 晋升后的镜像 revision 不对"; exit 1; }
          echo "  revision = $REV"

      - name: 失败时导出容器日志
        if: failure()
        run: docker logs smoke 2>&1 | tail -60 || true

      - name: 清理容器
        if: always()
        run: docker rm -f smoke 2>/dev/null || true
