name: Publish image

# 只在打 tag 的时候推（v1.0.0 这种），或者手动触发。
# 平时 push 到 master 不推镜像 —— 提交多了会在 ghcr 上堆一堆没人用的 layer。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要打的 tag（默认用 package 的 latest + 仓库版本号）"
        required: false
        default: ""

permissions:
  contents: read
  packages: write          # 这一行是关键：没有它 GITHUB_TOKEN 推不了 ghcr

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 tag
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAGGED="${{ github.event.inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAGGED="${GITHUB_REF#refs/tags/}"
            TAGGED="${TAGGED#v}"          # v1.0.0 → 1.0.0
          else
            TAGGED="dev"
          fi
          echo "ver=${TAGGED}" >> "$GITHUB_OUTPUT"
          echo "将要推送：${IMAGE}:${TAGGED} 和 :latest"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 两个 tag：具体版本方便回滚，latest 给「直接用」
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.ver }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.ver }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冒烟测试推上去的镜像
        run: |
          docker run -d --name smoke -p 8506:8506 \
            -e EBOOKFORGE_DATA=/data "${{ env.IMAGE }}:${{ steps.meta.outputs.ver }}"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8506/api/health > /dev/null; then
              echo "健康检查通过"; curl -s http://127.0.0.1:8506/api/health; exit 0
            fi
            sleep 2
          done
          echo "镜像起来了但健康检查没过"; docker logs smoke; exit 1
