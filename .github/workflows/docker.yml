name: Publish image

# 只在打 tag 的时候推（v1.0.0 这种），或者手动触发。
# 平时 push 到 master 不推镜像 —— 提交多了会在 ghcr 上堆一堆没人用的 layer。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要打的 tag（默认用 package 的 latest + 仓库版本号）"
        required: false
        default: ""

permissions:
  contents: read
  packages: write          # 这一行是关键：没有它 GITHUB_TOKEN 推不了 ghcr

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 tag
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAGGED="${{ github.event.inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAGGED="${GITHUB_REF#refs/tags/}"
            TAGGED="${TAGGED#v}"          # v1.0.0 → 1.0.0
          else
            TAGGED="dev"
          fi
          echo "ver=${TAGGED}" >> "$GITHUB_OUTPUT"
          echo "将要推送：${IMAGE}:${TAGGED} 和 :latest"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 两个 tag：具体版本方便回滚，latest 给「直接用」
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.ver }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.ver }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 确认镜像就是这次提交构建的
        run: |
          set -e
          IMG="${{ env.IMAGE }}:${{ steps.meta.outputs.ver }}"
          REV=$(docker image inspect "$IMG" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          echo "镜像 revision = $REV"
          echo "本次提交      = ${{ github.sha }}"
          [ "$REV" = "${{ github.sha }}" ] || { echo "✗ 镜像不是这次提交构建的（可能命中了旧缓存）"; exit 1; }

      - name: 起容器
        run: |
          docker run -d --name smoke -p 8506:8506 \
            -e EBOOKFORGE_DATA=/data \
            -e EBOOKFORGE_BOOK_DIR=/data/Book \
            "${{ env.IMAGE }}:${{ steps.meta.outputs.ver }}"

      - name: 镜像里该有的东西都在
        run: |
          set -e
          IMG="${{ env.IMAGE }}:${{ steps.meta.outputs.ver }}"
          # 中文字体是 PDF 中文渲染的命根子，镜像里少了它 health 照样 200，
          # 用户一转中文书才炸。这里先验一遍。
          docker run --rm --entrypoint sh "$IMG" -c 'ls -la /app/assets/fonts/ && test -n "$(ls /app/assets/fonts/ 2>/dev/null)"' \
            || { echo "✗ 镜像里没有字体"; exit 1; }
          docker run --rm --entrypoint python3 "$IMG" -c "import fastapi, uvicorn, multipart; print('web 依赖 OK')"

      - name: 端到端冒烟（上传→转换→下载）
        run: python3 .github/smoke_test.py --base http://127.0.0.1:8506

      - name: 失败时导出容器日志
        if: failure()
        run: docker logs smoke 2>&1 | tail -60 || true
