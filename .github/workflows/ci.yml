name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 引擎（bookforge/）零依赖，只用标准库。
      # 但 tests/ 里还有 Web 层的测试（分享模式越权、PWA 契约），
      # 它们要 import backend.main → 需要 fastapi / python-multipart；
      # 还要 TestClient → 需要 httpx2（见 requirements-dev.txt）。
      # 少这一句，test_share_security 会整个 import 失败，报错看着像代码坏了。
      - name: 装依赖（运行 + 测试）
        run: pip install -r requirements.txt -r requirements-dev.txt

      # 字体在仓库里（assets/fonts），P4/P5 那批排版测试因此不会被跳过。
      # CFF 样本也在仓库里（tests/fixtures/minimal-cff.otf，312 字节），P8 同样不会被跳过。
      - name: 跑测试
        run: python -m unittest discover -s tests -v

      - name: 语法检查
        run: python -m compileall -q bookforge backend

  docker:
    name: 镜像构建 + 冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t ebook-forge:ci .

      - name: 起容器验证健康检查
        run: |
          # 用 named volume 而不是 bind mount：
          # 容器以 uid 10000 运行，bind mount 一个宿主机目录时该目录归 runner 所有，
          # 非 root 写不进去 → mkdir('/data/uploads') Permission denied。
          # named volume 首次创建会从镜像的 /data 复制（含属主），不用额外 chown。
          docker run -d --name ebf -p 8506:8506 ebook-forge:ci
          for i in $(seq 1 30); do
            sleep 2
            if curl -sf --max-time 3 http://127.0.0.1:8506/api/health; then
              echo ""
              echo "健康检查通过"
              exit 0
            fi
          done
          echo "容器起不来，日志："
          docker logs ebf
          exit 1

      - name: 端到端冒烟（上传→转换→下载→校验输出名）
        run: |
          # 用 .github/smoke_test.py，和发布时跑的是同一份脚本：
          # 不只是「任务变成 done」，还要校验下载回来的文件名是原始书名
          # （P1-1 那条随机 ID 回归就靠这里兜住）、PDF 魔数、文件大小。
          python3 .github/smoke_test.py --base http://127.0.0.1:8506

      - name: 失败时导出容器日志
        if: failure()
        run: docker logs ebf --tail 60 || true

      - name: 清理
        if: always()
        run: docker rm -f ebf || true
